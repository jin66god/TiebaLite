name: 🐛 Bug 报告
description: 提交一个缺陷 / 闪退 / 异常问题
title: "【Bug】"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 感谢反馈！
        请尽量提供完整信息，方便快速定位问题。

  - type: input
    id: app-version
    attributes:
      label: 应用版本
      description: 在「我的 → 关于」中查看，或提供 APK 文件名中的版本号
      placeholder: 例如 4.0.0-beta.2+c0b530f
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 手机型号 / 系统版本
      description: 设备型号和 Android 系统版本
      placeholder: 例如 Redmi K70 / Android 14
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清楚简洁地描述发生了什么
      placeholder: 进入某吧后点击帖子，应用闪退……
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 按步骤列出如何复现
      placeholder: |
        1. 打开应用
        2. 进入 XX 吧
        3. 点击第 N 个帖子
        4. 闪退
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望看到什么结果
      placeholder: 正常打开帖子内容

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么（含报错信息）
      placeholder: 应用直接闪退回桌面 / 提示「应用已停止运行」

  - type: dropdown
    id: frequency
    attributes:
      label: 出现频率
      options:
        - 必现（每次都能复现）
        - 偶尔（多次操作出现一次）
        - 概率极低（只遇到过一次）
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 如有崩溃日志（logcat）、错误截图，粘贴或拖入图片
      placeholder: （可选）logcat 片段、截图、录屏
